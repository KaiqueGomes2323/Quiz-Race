<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Race — Telão</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{ overflow-x:hidden; }
  .wrap{ max-width:1200px; margin:0 auto; padding:clamp(18px,4vw,36px) clamp(14px,4vw,32px) 60px; }
  .header{ display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  .header h1{ font-size:clamp(22px, 4.5vw, 34px); }
  .qbox{
    margin:clamp(16px,4vw,22px) 0 clamp(24px,5vw,36px);
    padding:clamp(18px,4vw,26px) clamp(16px,4vw,30px);
    text-align:center;
  }
  .qbox .label{ font-size:12.5px; color:var(--text-low); margin-bottom:8px; letter-spacing:0.04em; }
  .qbox .text{ font-size:clamp(19px, 3.6vw, 26px); font-weight:800; font-family:var(--font-display); overflow-wrap:anywhere; }
  .timer-bar-bg{ height:8px; border-radius:999px; background:var(--asphalt-800); overflow:hidden; margin-top:18px; }
  .timer-bar-fill{ height:100%; background:var(--flag-yellow); border-radius:999px; transition:width 0.25s linear; }
  .timer-num{ font-size:12px; color:var(--text-low); margin-top:6px; }
  .track-row{ position:relative; margin-bottom:clamp(22px,4vw,34px); }
  .track-label{ display:flex; justify-content:space-between; gap:8px; font-size:clamp(12.5px,2.4vw,14px); font-weight:700; margin-bottom:6px; }
  .track-label span:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .track-label .status{ font-size:12px; color:var(--text-low); font-weight:500; flex-shrink:0; }
  .track{
    position:relative;
    height:clamp(40px, 7vw, 56px);
    border-radius:14px;
    background:
      linear-gradient(90deg, rgba(66,232,255,0.05), transparent 30%, transparent 70%, rgba(255,95,216,0.05)),
      var(--asphalt-800);
    border:1px solid var(--line-faint);
    box-shadow:inset 0 0 24px rgba(0,0,0,0.35);
    overflow:visible;
  }
  .track::after{
    content:'';
    position:absolute; left:14px; right:14px; top:50%;
    height:2px;
    transform:translateY(-50%);
    background:repeating-linear-gradient(90deg, var(--line-mid) 0 14px, transparent 14px 26px);
    border-radius:2px;
  }
  .finish-flag{
    position:absolute; right:6px; top:-4px; bottom:-4px;
    width:6px;
    background:repeating-linear-gradient(45deg, #fff 0 6px, #111 6px 12px);
    border-radius:3px;
    opacity:0.9;
    box-shadow:0 0 12px rgba(255,210,63,0.5);
  }
  .car{
    position:absolute; top:50%; transform:translate(-6px, -50%) scaleX(-1);
    font-size:clamp(22px, 4.5vw, 34px);
    transition:left 1s cubic-bezier(.2,.7,.3,1);
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.55)) drop-shadow(0 0 10px rgba(66,232,255,0.35));
  }
  .waiting-box, .finish-box{
    text-align:center; padding:clamp(36px,10vw,70px) 20px;
  }
  .finish-box .big{ font-size:clamp(40px,10vw,64px); margin-bottom:14px; }
  .reveal-strip{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:18px; }
  .reveal-chip{
    font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:999px;
    border:1px solid var(--line-mid);
  }

  @media (max-width:560px){
    .header{ align-items:flex-start; }
    .header .row{ gap:8px !important; }
  }
</style>
</head>
<body>
<div class="asphalt-bg"></div>

<div class="wrap">
  <div class="header">
    <h1>🏁 Quiz Race</h1>
    <div class="row" style="gap:14px;">
      <span class="tag" title="A resposta correta é cifrada com AES-256 antes de ir pro Firebase">🔒 AES-256</span>
      <div class="code-badge" style="font-size:20px;" id="roomCodeDisplay">-----</div>
    </div>
  </div>

  <div id="root">
    <div class="glass waiting-box">
      <p>Conectando na sala...</p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/crypto-utils.js"></script>
<script src="js/display.js"></script>
</body>
</html>
