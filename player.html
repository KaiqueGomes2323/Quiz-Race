<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Race — Jogar</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .wrap{
    max-width:480px; margin:0 auto;
    padding:clamp(18px,6vw,28px) clamp(14px,5vw,18px) 60px;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
  }
  .team-strip{ display:flex; align-items:center; gap:10px; margin-bottom:24px; flex-wrap:wrap; }
  .team-dot{ width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  .center-msg{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; }
  .center-msg .big{ font-size:clamp(34px,10vw,44px); }
  .opt-btn{
    display:block; width:100%; text-align:left;
    background:var(--asphalt-800); border:1.5px solid var(--line-mid);
    border-radius:14px; padding:16px 18px; margin-bottom:10px;
    font-size:15.5px; font-weight:600; transition:border-color .12s ease, background .12s ease, transform .1s ease;
    overflow-wrap:anywhere;
  }
  .opt-btn:active{ transform:scale(0.98); }
  .opt-btn:not(:disabled):hover{ border-color:var(--purple); }
  .opt-btn.selected{ border-color:var(--purple); background:rgba(139,107,242,0.14); }
  .opt-btn.correct{ border-color:var(--team-3); background:rgba(75,242,160,0.14); }
  .opt-btn.wrong{ border-color:var(--team-1); background:rgba(242,85,75,0.14); }
  .opt-btn:disabled{ cursor:default; }
  .q-number{ font-size:12px; color:var(--text-low); margin-bottom:6px; }
  .q-text{ font-size:clamp(17px,4.5vw,20px); font-weight:700; margin-bottom:22px; line-height:1.35; overflow-wrap:anywhere; }
  .timer-pill{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--asphalt-800); border:1px solid var(--line-mid);
    border-radius:999px; padding:6px 14px; font-size:13px; font-weight:700;
    margin-bottom:16px; color:var(--flag-yellow);
  }

  @media (min-width:601px){
    .wrap{ padding-top:clamp(28px,5vw,44px); }
  }
</style>
</head>
<body>
<div class="asphalt-bg"></div>

<div class="wrap">
  <div class="team-strip">
    <div class="team-dot" id="teamDot" style="background:var(--purple);"></div>
    <div style="font-size:13px; color:var(--text-mid);">Time <strong id="teamNameLabel" style="color:var(--text-hi);">-</strong> · <span id="playerNameLabel">-</span></div>
  </div>

  <div id="content" class="center-msg">
    <div class="big">🏁</div>
    <p>Conectando na sala...</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="js/crypto-utils.js"></script>
<script src="js/settings.js"></script>
<script src="js/player.js"></script>
</body>
</html>
